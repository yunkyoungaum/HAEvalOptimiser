# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: optimization-customer-support-python-responses
requiredVersions:
    azd: '>=1.27.1'
    extensions:
        azure.ai.agents: '>=1.0.0-beta.9'
services:
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-4.1
                version: "2025-04-14"
              name: gpt-4.1
              sku:
                capacity: 30
                name: GlobalStandard
        host: azure.ai.project
    optimization-customer-support-python-responses:
        codeConfiguration:
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        description: Realistic customer support agent for a consumer electronics company with agent optimizer support. Demonstrates meaningful instruction and skill optimization — ships with eval dataset for out-of-the-box optimization.
        displayName: Optimization Customer Support (Python, Responses)
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            OPTIMIZATION_LOCAL_DIR: .agent_configs
            PYTHONNOUSERSITE: "1"
        host: azure.ai.agent
        kind: hosted
        language: python
        metadata:
            tags:
                - AI Agent Hosting
                - Responses Protocol
                - Bring Your Own
                - Python
                - Agent Optimization
                - Customer Support
        name: optimization-customer-support-python-responses
        project: src/optimization-customer-support-python-responses
        protocols:
            - protocol: responses
              version: 2.0.0
        uses:
            - ai-project
    optimization-customer-support-python-responses-evals:
        $ref: ./evals/azure.eval.yaml
        host: azure.ai.eval
        uses:
            - ai-project
            - optimization-customer-support-python-responses
